<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTMLジェネレーター</title>

  <link rel="stylesheet" href="ge-style.css">
 
</head>
<body>
  <div class="container">
    <h1>HTMLジェネレーター</h1>
    <p class="desc">必要事項を入力して「生成する」を押すと、そのままダウンロードできるHTMLファイルを作ります。</p>

    <div class="section">
      <p class="section-title">サイト情報</p>
      <div class="field-row">
        <div class="field">
          <label>サイト名</label>
          <input type="text" id="siteName" placeholder="mysite">
        </div>
        <div class="field">
          <label>作品フォルダ名</label>
          <input type="text" id="workFolder" placeholder="work1">
        </div>
      </div>
      <div class="field">
        <label>作品タイトル（メニューに表示される名前）</label>
        <input type="text" id="workTitle" placeholder="作品タイトル1">
      </div>
    </div>

    <div class="section">
      <p class="section-title">話の情報</p>
      <div class="field-row">
        <div class="field">
          <label>話数（例：第1話）</label>
          <input type="text" id="epNumber" placeholder="第1話">
        </div>
        <div class="field">
          <label>話のタイトル</label>
          <input type="text" id="epTitle" placeholder="話のタイトル">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>前の話のファイル名（なければ空欄）</label>
          <input type="text" id="prevEp" placeholder="ep1.html">
        </div>
        <div class="field">
          <label>次の話のファイル名（なければ空欄）</label>
          <input type="text" id="nextEp" placeholder="ep3.html">
        </div>
      </div>
      <div class="field">
        <label>このファイルの保存名（例：ep2.html）</label>
        <input type="text" id="fileName" placeholder="ep2.html">
        <p class="hint">※ ダウンロード時のファイル名になります</p>
      </div>
    </div>

    <div class="section">
      <p class="section-title">本文</p>
      <div class="field">
        <label>｜単語《ルビ》形式で入力。空行で段落区切り、　――で改ページ。</label>
        <textarea id="body" rows="12" placeholder="｜夢《ゆめ》の中で、彼は静かに笑った。&#10;&#10;　――&#10;&#10;新しい場面はこんな感じ。"></textarea>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-generate" onclick="generate()">生成する</button>
      <button class="btn-download" id="dlBtn" onclick="download()" disabled>ダウンロード</button>
      <button class="btn-copy" id="copyBtn" onclick="copyOutput()" disabled>HTMLをコピー</button>
      <button class="btn-clear" onclick="clearAll()">クリア</button>
    </div>

    <div class="section">
      <p class="section-title">生成されたHTML</p>
      <div class="output-area" id="output">ここに生成結果が表示されます</div>
    </div>

    <p class="notice">
      ※ このツールはブラウザ上で動作します。入力内容はどこにも送信されません。<br>
      ※ ダウンロードしたファイルは mysite/作品フォルダ名/ の中に置いてください。
    </p>
  </div>

  <script src="ge-script.js"></script>

</body>
</html>
