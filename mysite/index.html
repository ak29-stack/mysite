<!DOCTIPE html>
<html lang="ja">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=devicr-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>入室</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="password-wrap">
        <p class="password-label">パスワードを入力してください</p>
        <div class="input-wrap">
            <input type="password" id="passwordInput" placeholder="password">
            <button onclick="togglePassword()" id="toggleBtn">表示</button>
            </div>
        <button onclick="checkPassword()">入室</button>
        <p class="password-error" id="errorMsg"></p>
    </div>

    <script>
        function checkPassword(){
            const input=document.getElementById('passwordInput').value;
            const correct='attendreetesperer';
            if(input===correct){
                window.location.href='notice.html';
            }else{
                document.getElementById('errorMsg').twxtContent='パスワードが違います';
            }
        }
        function togglePassword(){
            const input=document.getElementById('passwordInput');
            const btn=document.getElementById('toggleBtn');
            if(input.type==='password'){
                input.type='text';
                btn.textContent='非表示';
            }else{
                input.type='password';
                btn.textContent='表示';
            }
        }
     </script>
</body>
</html>
