<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>アドラステイアのまなざし - mysite</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="../top.html" class="site-title">mysite</a>
      <button class="hamburger" onclick="toggleMenu()" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <nav class="nav-menu" id="navMenu">
    <ul>
      <li><a href="../top.html">トップ</a></li>
      <li><a href="../work1/index.html">アドラステイアのまなざし</a></li>
      <li><a href="../chara.html">キャラクター一覧</li>
      <li><a href="../notice.html">注意事項</a></li>
    </ul>
  </nav>

  <main class="main">
    <h1 class="page-title">アドラステイアのまなざし</h1>

    <div class="work-info">
      <p class="work-info-meta">進撃の巨人　エルヴィン・スミス　ライナー・ブラウン</p>
      <p class="work-info-summary">
        104期生のシャルロット・ローゼンベルクは自称“この世で最も高貴で強靱で美麗で気品の塊で、
        立てば芍薬座れば牡丹歩く姿は百合の花な絶世の美少女”。
        その自称に違わぬ強さと美しさと高慢さで広く知られていた。
        しかし、そんな彼女はある重大な秘密を抱えており……</p>
    </div>

    <div class="ep-list" id="epList"></div>
  </main>

  <script src="../script.js"></script>
  <script>
    fetch('episodes.json')
  .then(res => res.json())
  .then(data => {
    const epList = document.getElementById('epList');
    data.forEach(ep => {
      epList.innerHTML += `
        <a href="${ep.file}" class="ep-item">
          <span class="ep-number">${ep.number}</span>
          <span class="ep-title">${ep.title}</span>
        </a>
      `;
    });
  });
  </script>
</body>
</html>
