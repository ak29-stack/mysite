<body>

  <header class="header">
    <div class="header-inner">
      <a href="../top.html" class="site-title">mysite</a>
      <button class="hamburger" onclick="toggleMenu()" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <nav class="nav-menu" id="navMenu">
    <ul>

  <main class="main">
    <h1 class="page-title">我が手に刃を、君に愛を。</h1>

    <div class="work-info">
      <p class="work-info-meta">ONE PIECE　エース</p>
      <p class="work-info-summary">
        あらすじ</p>
    </div>

    <div class="ep-list" id="epList"></div>
  </main>

  <script src="../script.js"></script>
  <script>
    fetch('episodes.json')
  .then(res => res.json())
  .then(data => {
    const epList = document.getElementById('epList');
    data.forEach(ep => {
      epList.innerHTML += `
        <a href="${ep.file}" class="ep-item">
          <span class="ep-number">${ep.number}</span>
          <span class="ep-title">${ep.title}</span>
        </a>
      `;
    });
  });
  </script>
